# Flow: Splash screen then login screen (single launch, no clearState for login).
# Launches app once, waits for splash to finish, then runs login steps without relaunching.
# App ID: iOS uses .dev. For Android use: com.icapps.fluttertemplate.debug

appId: com.icapps.fluttertemplate.dev
---
- launchApp:
    clearState: true
# If Analytics permission screen is shown (first launch), tap Accept
- runFlow:
    when:
      visible: "Accept"
    commands:
      - tapOn:
          text: "Accept"
# Wait for splash to complete and login screen (Email hint visible)
- extendedWaitUntil:
    visible:
      text: "Email"
    timeout: 18000
# Run login steps without relaunching or clearing state
- runFlow: login_steps.yaml
