# Maestro test: Splash screen
# Verifies the app launches, shows splash, and navigates to the next screen.
# On first run the Analytics permission screen may appear; we tap Accept then continue.
#
# App ID: iOS uses .dev (this file). For Android use: com.icapps.fluttertemplate.debug

appId: com.icapps.fluttertemplate.dev
---
- launchApp:
    clearState: true
# If Analytics permission screen is shown (first launch), tap Accept
- runFlow:
    when:
      visible: "Accept"
    commands:
      - tapOn:
          text: "Accept"
# Wait for splash to complete and next screen (Login); match by key emailInput
- extendedWaitUntil:
    visible:
      text: "Email"
    timeout: 18000
- assertVisible:
    text: "Login\nJust fill in some text. There is no validator for the login\nLogin" # Some issue with the test so it's wierly layouted
