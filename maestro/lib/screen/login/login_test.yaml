# Maestro test: Login screen (standalone).
# Launches with clearState, navigates to login, then runs shared login steps.
# For flow without clearState (splash then login), use flow/splash_then_login.yaml.
# App ID: iOS uses .dev. For Android use: com.icapps.fluttertemplate.debug

appId: com.icapps.fluttertemplate.dev
---
- launchApp:
    clearState: true
# If Analytics permission screen is shown (first launch), tap Accept
- runFlow:
    when:
      visible: "Accept"
    commands:
      - tapOn:
          text: "Accept"
# Wait for login screen (email field hint visible)
- extendedWaitUntil:
    visible:
      text: "Email"
    timeout: 18000
# Reuse login steps (fill email/password, assert Login button enabled)
- runFlow: ../../flow/login_steps.yaml
